function av(s,z){const r=()=>{s=(s*9301+49297)%233280;return s/233280};
 const sk=['#f1c27d','#e0a370','#c68642','#8d5524','#ffdbac'][Math.floor(r()*5)],hr=['#222','#6b3e1d','#c9a227','#a33'][Math.floor(r()*4)],bg=['#5b3a8c','#2f6f9f','#8c3a4a','#3a7a5b'][Math.floor(r()*4)],nr=18+Math.floor(r()*5),ny=32+Math.floor(r()*6);
 return `<span class="av" style="width:${z}px;height:${z}px"><svg width="${z}" height="${z}" viewBox="0 0 100 100" style="overflow:visible" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="${bg}" stroke="#d9cdb0" stroke-width="3"/><ellipse cx="50" cy="46" rx="30" ry="42" fill="${sk}"/><path d="M21 20Q50-8 79 20Q50 11 21 20Z" fill="${hr}"/><circle cx="40" cy="55" r="3.6" fill="#111"/><circle cx="60" cy="55" r="3.6" fill="#111"/><path d="M33 47l12-3M67 47l-12-3" stroke="#111" stroke-width="2.5"/><g transform="rotate(-16 52 64)"><ellipse cx="54" cy="${70+ny*.45}" rx="${nr}" ry="${ny}" fill="${sk}" stroke="#0006" stroke-width="2.5"/><circle cx="46" cy="${70+ny*.9}" r="2.6" fill="#0007"/><circle cx="60" cy="${70+ny*.9}" r="2.6" fill="#0007"/></g><path d="M36 87Q46 91 56 87" stroke="#a33" stroke-width="3" fill="none"/></svg></span>`}
function cd(c,cls,attr,st){
 if(!c)return `<div class="cd empty ${cls||''}"></div>`;
 let ic,lb=c.l,col;
 if(c.k==='red'){ic='🟥';col='#d94b6b'}else if(c.k==='var'){ic='📺';col='#6cd44b'}else if(c.k==='pun'){ic='⚠️';lb=c.t;col='#4b5bd9'}
 else{ic=c.cat==='born'?FL[c.v]:IC[c.cat];col=CO[c.cat]}
 return `<div class="cd ${cls||''}" ${attr||''} style="--s:${col};${st||''}"><div class="ic">${ic}</div><div class="lb">${esc(lb)}</div></div>`}
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>send({t:"hi"});
 ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.ply){PLY=d.ply;return}if(d.err){toast(d.err);return}
  if(lastEv<0)lastEv=Math.max(0,...(d.ev||[]).map(x=>x.s));
  fly(d);S=d;render();if(d.ann){const me=d;setTimeout(()=>{if(S===me){S.ann=null;render()}},d.ann.ms+60)}};
 ws.onclose=()=>setTimeout(connect,1500)}
function render(){
 if(!S)return;
 const me=S.pl.find(p=>p.id===S.me);
 if(S.phase==='lobby')return lobby(me);
 if(S.phase==='over')return over();
 game(me)}
const VH=()=>innerHeight/100;
const CR='<div class="cr">* קרדיט ל״איתן דרוקרש״ (Credit to “Eitan Druckresh”)</div>';
function lobby(me){
 if(!me&&document.getElementById("nm"))return;
 let h='<div class="pitch">'+S.pl.map((p,i)=>{const[x,y]=LX[i];return `<div class="pl" style="left:${x}%;top:${y}%">${av(p.av,Math.round(VH()*11))}<br><span class="chip">${esc(p.name)}</span><br><small>${p.pos}</small><div class="${p.ready?'rd':''}">${p.ready?'✔ מוכן':'ממתין'}</div></div>`}).join("")+'</div><div class="lbar">';
 if(!me)h+='<input id="nm" maxlength="12" placeholder="השם שלך"><button class="p" id="go">הצטרף</button>';
 else h+=`<button class="${me.ready?'':'g'}" id="rd">${me.ready?'ביטול מוכנות':'מוכן / התחל'}</button><span class="chip" style="font-size:3vh">${S.pl.length<2?'ממתינים לעוד שחקנים (2–8)':'המשחק מתחיל כשכולם מוכנים'}</span>`;
 app.innerHTML=h+'</div>'+CR;
 const g=document.getElementById("go");if(g)g.onclick=()=>{const n=document.getElementById("nm").value.trim();if(n)send({t:"join",name:n})};
 const r=document.getElementById("rd");if(r)r.onclick=()=>send({t:"ready"})}
function over(){
 app.innerHTML='<div class="ovl"><div class="ovb"><h3>🏆 המשחק נגמר</h3><div class="sc">'+S.rank.map((n,i)=>`<div><span>${i+1}. ${esc(n)}</span><span>${i==0?'🥇':''}</span></div>`).join("")+'</div><button class="p" id="ag">משחק חדש</button></div></div>';
 document.getElementById("ag").onclick=()=>send({t:"again"})}
const MG='<svg width="22" height="20" viewBox="0 0 24 22" aria-hidden="true" style="vertical-align:-3px"><path d="M2 8h5l9-5v16l-9-5H2z" fill="currentColor"/><path d="M19 7q3 4 0 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
function game(me){
 const mine=S.turn===S.me,cu=S.pl.find(p=>p.id===S.turn),busy=S.modal||S.vote,selc=S.hand.find(c=>c.id===sel);
 const oh=app.querySelector('.hand'),sl=oh?oh.scrollLeft:0,z=Math.round(VH()*9),n=S.hand.length;
 let h='';
 h+=`<div class="a" style="left:3%;top:2.5%;font-size:2.7vh;font-weight:800;text-shadow:0 1px 3px #000;max-width:20%">RED CARDS / PUNISHMENT CARDS</div>`;
 h+=`<div class="a fill" id="disc" style="left:22%;top:9%;height:19vh"><div class="cd back" style="background:#d62828;border-color:#f6b3b3;transform:rotate(-16deg) translate(-12%,2%)"></div><div class="cd back" style="background:#d62828;border-color:#f6b3b3;position:absolute;inset:0;transform:rotate(12deg) translate(10%,-3%)"></div>${S.disc?cd(S.disc,'','','position:absolute;inset:0;transform:rotate(-3deg)'):''}</div>`;
 S.pl.filter(p=>p.id!==S.me).forEach((p,i)=>{const[x,y]=SL[i]||SL[0],k=Math.min(p.n,12);
  h+=`<div class="oh ${p.id===S.turn?'on':''}" id="o-${p.id}" style="left:${x}%;top:${y}%"><div class="hd">${av(p.av,z)}<span class="chip">${esc(p.name)}</span><span class="badge" style="position:static">${p.out?'🏁':p.n}</span></div><div class="stk" id="stk-${p.id}">${p.out?'':Array.from({length:k},(_,j)=>`<i style="transform:rotate(${(j-(k-1)/2)*6}deg)"></i>`).join('')}</div></div>`});
 h+=`<div class="a fill glow-o" id="punp" style="left:25.6%;top:39%"><div class="cd back"></div><span class="badge">${S.pun}</span><div class="cap" style="color:#ffb066">PUNISHMENT PILE</div></div>`;
 [38.8,49.8,60.8].forEach((x,i)=>{const t=S.piles[i].top;h+=`<div class="a fill" id="pile-${i}" data-p="${i}" style="left:${x}%;top:39%">${cd(t,'')}<span class="badge">${S.piles[i].n}</span><div class="cap" style="color:#cfe">${t?HE[t.cat]||'':''}</div></div>`});
 h+=`<div class="a fill glow-b" id="deckp" style="left:89.1%;top:39%"><div class="cd back"></div><span class="badge">${S.deck}</span><div class="cap" style="color:#9fdcff">DRAW PILE</div></div>`;
 if(S.ann)h+=`<div class="ban">${esc(S.ann.t)}</div>`;
 h+=`<div class="info">${S.pen?`<span class="pen">עונש פעיל: ${esc(S.pen)}</span><br>`:''}${esc(S.last?'אחרון: '+S.last:'')} · <b>${mine?'התור שלך! 🎯':'תור של '+esc(cu?cu.name:'')}</b></div>`;
 h+=`<div class="pan" id="panr"><div class="tm"><span id="tm">${Math.ceil(S.left/1000)}</span><small> s</small></div><button id="cat" ${busy?'disabled':''}>החלף קטגוריה</button><div class="row"><button id="mg" ${S.canChal?'':'disabled'}>${MG}</button><button id="end" ${busy?'disabled':''}>סיום מוקדם</button></div><div style="font-size:2.4vh;text-align:center">${S.mega?'מגפון: זמין':'מגפון: חסום'}</div></div>`;
 h+='<div class="pan" id="panl">';
 if(mine&&S.choose&&!S.modal)h+='<button class="p" data-pen="main">שלוף קלף רגיל</button><button class="r" data-pen="pun">שלוף קלף עונש</button>';
 else if(mine&&!busy)h+=`${selc&&selc.k==='red'?'<button class="r" id="red">שחק אדום</button>':''}<button id="pass">אין לי מה לשחק</button>`;
 h+='</div>';
 h+='<div class="hand">'+S.hand.map((c,i)=>{const o=i-(n-1)/2,sc=Math.min(3,18/Math.max(n,6));return cd(c,'','data-c="'+c.id+'"',`transform:translateY(${(o*o*.35*Math.min(1,6/n)+(c.id===sel?-2.6:0)).toFixed(2)}vh) rotate(${(o*sc).toFixed(1)}deg);${c.id===sel?'box-shadow:0 0 0 3px #ffe66d;':''}`)}).join("")+'</div>';
 const m=S.modal,v=S.vote;
 if(m){const by=m.by===S.me;h+=`<div class="ovl"><div class="ovb"><h3>${esc(m.title)}</h3><div>${esc(m.text)}</div>`+
  (m.kind==='chalpick'?(by?'<button class="p" data-cp="std">שלוף 2 קלפים רגילים</button><button class="r" data-cp="pun">שלוף קלף עונש</button>':'<div class="capt">ממתינים להחלטה…</div>'):
   (m.by==null||by)?'<button class="p" id="ok">הבנתי</button>':'<div class="capt">ממתינים לאישור…</div>')+'</div></div>'}
 else if(v){h+=`<div class="ovl"><div class="ovb">`+(v.type==='cat'?`<div>כפתור החלפת הקטגוריה נלחץ. האם אתה מסכים להחליף קטגוריה?</div>`:v.type==='end'?`<div>${esc(v.byName)} מבקש/ת לסיים את המשחק מוקדם. האם אתה מסכים?</div>`:`<h3>📢 ערעור של ${esc(v.byName)}</h3><div>האם השחקן "${esc(v.name)}" של ${esc(v.tn)} מתאים לקריטריונים?</div><div class="capt">סיבת הערעור: ${esc(v.reason||'—')}</div>`)+
  (v.mine?'<div class="capt">ממתינים לשאר השחקנים…</div>':'<button class="g" data-v="1">כן</button><button class="r" data-v="0">לא</button>')+'</div></div>'}
 app.innerHTML=h;
 const nh=app.querySelector('.hand');if(nh)nh.scrollLeft=sl;
 rects={};app.querySelectorAll("[data-c]").forEach(e=>rects[e.dataset.c]=e.getBoundingClientRect());
 const q=s=>app.querySelector(s);
 app.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>{sel=sel===e.dataset.c?null:e.dataset.c;render()});
 app.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>{if(mine&&!busy&&!S.choose&&selc){if(selc.k==='reg')askName(+e.dataset.p,selc.id);else toast('קלף מיוחד אינו מונח על ערימה')}});
 app.querySelectorAll("[data-pen]").forEach(e=>e.onclick=()=>send({t:"pen",kind:e.dataset.pen}));
 app.querySelectorAll("[data-cp]").forEach(e=>e.onclick=()=>send({t:"cpick",k:e.dataset.cp}));
 app.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>send({t:"vote",y:e.dataset.v==="1"}));
 if(q("#red"))q("#red").onclick=()=>{send({t:"red",card:sel});sel=null};
 if(q("#pass"))q("#pass").onclick=()=>send({t:"pass"});
 if(q("#ok"))q("#ok").onclick=()=>send({t:"ok"});
 q("#cat").onclick=()=>send({t:"cat"});q("#end").onclick=()=>send({t:"endv"});
 q("#mg").onclick=()=>askText("📢 למה השחקן לא מתאים ל-3 הקטגוריות?","סיבה קצרה…",t=>send({t:"chal",reason:t}))}
function flyEl(html,a,b,ms,delay,curve){
 const d=document.createElement('div');d.innerHTML=html;const el=d.firstChild;
 el.style.cssText+=`;position:fixed;left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;z-index:50;pointer-events:none;margin:0;transform-origin:center`;
 fl.appendChild(el);
 const dx=a.left+a.width/2-(b.left+b.width/2),dy=a.top+a.height/2-(b.top+b.height/2),sc=Math.max(.3,Math.min(1.2,a.width/b.width));
 const mx=dx*.45,my=dy*.45-(curve?Math.abs(dx)*.25+30:0);
 el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(${dx>0?-12:12}deg)`},{transform:`translate(${mx}px,${my}px) scale(${(sc+1)/2}) rotate(${dx>0?-4:4}deg)`,offset:.5},{transform:'translate(0,0) scale(1) rotate(0)'}],{duration:ms,delay,easing:'ease-in-out',fill:'both'}).onfinish=()=>el.remove()}
function fly(d){(d.ev||[]).forEach(e=>{if(e.s<=lastEv)return;lastEv=e.s;
 const R=id=>{const x=document.getElementById(id);return x&&x.getBoundingClientRect()};
 if(e.k==='play'||e.k==='red'){
  const dst=e.k==='play'?R('pile-'+e.pile):R('disc');
  const src=e.by===d.me&&rects[e.card.id]?rects[e.card.id]:(R('stk-'+e.by)||R('o-'+e.by));
  if(dst&&src)flyEl(cd(e.card,''),src,dst,800,0,true)}
 else if(e.k==='draw'){
  const src=R(e.from==='pun'?'punp':'deckp'),hand=document.querySelector('.hand'),dst=e.to===d.me?(hand&&hand.getBoundingClientRect()):(R('stk-'+e.to)||R('o-'+e.to));
  if(!src||!dst)return;
  const w=src.width*(e.to===d.me?1:.5),h=src.height*(e.to===d.me?1:.5);
  const to={left:dst.left+dst.width/2-w/2,top:e.to===d.me?dst.top+dst.height*.2:dst.top+dst.height/2-h/2,width:w,height:h};
  for(let i=0;i<Math.min(e.n,4);i++)flyEl('<div class="cd back"></div>',src,to,700,i*220,true)}})}
function askText(title,ph,cb,sug){
 ov.innerHTML=`<div class="ovb"><div>${title}</div><input id="pn" autocomplete="off" placeholder="${ph}"><div class="sg" id="sg"></div><button class="p" id="okn">אישור</button><button id="cn">ביטול</button></div>`;
 ov.style.display="flex";const i=document.getElementById("pn"),sg=document.getElementById("sg");i.focus();
 const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(sug)i.oninput=()=>{const v=nz(i.value.trim());sg.innerHTML=v?PLY.filter(p=>nz(p[0]).includes(v)).slice(0,3).map(p=>`<div data-n="${esc(p[0])}">${esc(p[0])} (${p[1]})</div>`).join(""):"";sg.querySelectorAll("div").forEach(d=>d.onclick=()=>{i.value=d.dataset.n;sg.innerHTML=""})};
 const close=()=>{ov.style.display="none";ov.innerHTML=""};
 document.getElementById("cn").onclick=close;
 document.getElementById("okn").onclick=()=>{const n=i.value.trim();if(!n)return;close();cb(n)}}
const askName=(pi,card)=>askText("איזה שחקן מתאים לשלושת הקלפים?","הקלד שם חופשי…",n=>{send({t:"play",card,pile:pi,name:n});sel=null},true);
setInterval(()=>{if(S&&S.phase==='play'&&!S.choose&&!S.modal&&!S.vote&&!S.ann){S.left=Math.max(0,S.left-250);const t=document.getElementById("tm");if(t)t.textContent=Math.ceil(S.left/1000)}},250);
connect();
</script></body></html>
